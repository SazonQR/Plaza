<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plaza</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf0;font:14px system-ui}nav{display:flex;gap:10px;align-items:center;padding:12px 20px;background:#1e5a42;color:white;flex-wrap:wrap}button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer}button.active{background:#ef5b2a;color:white}iframe{display:block;width:100%;height:calc(100dvh - 100px);min-height:600px;border:0}.hidden{display:none!important}</style></head><body><nav><strong id="venueHeader">Plaza · Powered By Sazon</strong><button id="patronBtn" class="active" onclick="view('patron')">Patron ordering</button><button id="vendorBtn" onclick="view('vendor')">Vendor administration</button><button id="merchantBtn" onclick="view('merchant')">Merchant Administration</button><small id="syncStatus">Loading settings…</small></nav><iframe id="patron" title="Patron ordering"></iframe><iframe id="admin" class="hidden" title="Administration"></iframe><script>
const patron=document.getElementById('patron'),admin=document.getElementById('admin');let state=null;
window.setPlazaState=function(data){state={...data,type:'plazaState'};document.getElementById('venueHeader').textContent=data.brand+' Plaza · Powered By Sazon';document.title=data.brand+' Plaza';document.querySelector('nav').style.background=data.color;if(typeof patron.contentWindow.applyPlazaState==='function')patron.contentWindow.applyPlazaState(state);else patron.contentWindow.postMessage(state,'*');document.getElementById('syncStatus').textContent='Settings synchronized · '+new Date().toLocaleTimeString()};
function pullLatest(){if(typeof admin.contentWindow.exportPlazaState==='function')setPlazaState(admin.contentWindow.exportPlazaState());else if(state)setPlazaState(state)}
function view(which){pullLatest();patron.classList.toggle('hidden',which!=='patron');admin.classList.toggle('hidden',which==='patron');['patron','vendor','merchant'].forEach(k=>document.getElementById(k+'Btn').classList.toggle('active',k===which));if(which!=='patron'&&typeof admin.contentWindow.openPlazaView==='function')admin.contentWindow.openPlazaView(which)}
window.addEventListener('message',e=>{if(e.source===admin.contentWindow&&e.data?.type==='adminState')setPlazaState(e.data);if(e.source===admin.contentWindow&&e.data?.type==='openPatron')view('patron');if(e.source===patron.contentWindow&&e.data?.type==='patronReady')pullLatest()});patron.addEventListener('load',pullLatest);admin.addEventListener('load',pullLatest);window.addEventListener('focus',pullLatest);
patron.srcdoc="\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003ePlaza \u2014 Powered by Sazon\u003c/title\u003e\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin\u003e\u003clink href=\"https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap\" rel=\"stylesheet\"\u003e\n\u003cstyle\u003e\n:root{--ink:#1c241d;--cream:#fffaf0;--paper:#fffdf8;--orange:#ef5b2a;--green:#1e5a42;--line:#e9e4d9;--muted:#6c746c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}.shell{max-width:1180px;margin:auto;padding:0 28px}.top{border-bottom:1px solid #e8e2d6;background:#fffdf9}.top .shell{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font:700 30px Fraunces,serif;letter-spacing:-1.5px}.brand i{color:var(--orange);font-style:normal}.brand-lockup{display:flex;flex-direction:column;gap:2px}.powered-by{font-size:11px;font-weight:500;letter-spacing:.2px;color:var(--muted)}.loc{font-size:14px;font-weight:700}.hero{display:flex;justify-content:space-between;gap:30px;padding:44px 0 24px}.eyebrow{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--orange);font-weight:700}.hero h1{margin:9px 0 11px;font:700 clamp(37px,5vw,58px)/.98 Fraunces,serif;letter-spacing:-2.5px}.hero p{margin:0;color:var(--muted);font-size:17px}.open{align-self:flex-end;padding:9px 13px;border-radius:999px;background:#eaf5ec;color:#25723d;font-size:13px;font-weight:700}.dot{display:inline-block;background:#39a750;width:7px;height:7px;border-radius:50%;margin-right:6px}.tabs-wrap{position:sticky;top:0;z-index:8;background:var(--cream);padding:12px 0;border-bottom:1px solid var(--line)}.tabs{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:var(--paper);font:600 14px 'DM Sans';cursor:pointer;color:#4d564e}.tab.active{background:var(--green);border-color:var(--green);color:white}.vendor{margin:28px 0 120px;background:var(--paper);border:1px solid var(--line);border-radius:25px;overflow:hidden}.vendor-head{display:grid;grid-template-columns:1.1fr .9fr;min-height:300px}.vendor-info{padding:43px}.kicker{font-size:13px;font-weight:700;color:#477258}.vendor h2{margin:12px 0;font:700 43px/1 Fraunces,serif;letter-spacing:-1.8px}.desc{line-height:1.5;color:var(--muted);max-width:400px}.facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:24px;font-size:14px;font-weight:600}.photo{min-height:300px;background:center/cover no-repeat}.menu{padding:34px 43px 42px}.menu-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.menu h3{margin:0;font:700 25px Fraunces,serif}.full{color:var(--green);font-size:14px;font-weight:700}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{border:1px solid var(--line);border-radius:15px;padding:17px;display:flex;align-items:center;gap:12px}.item-name{font-size:15px;font-weight:700}.item small{display:block;margin-top:4px;color:var(--muted)}.price{margin-left:auto;font-weight:700;white-space:nowrap}.add{border:0;border-radius:9px;width:32px;height:32px;background:#fbe2d7;color:#c6461b;font-size:21px;cursor:pointer}.cart{position:fixed;z-index:15;bottom:20px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));display:none;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 12px 18px;background:var(--ink);color:white;border-radius:16px;box-shadow:0 12px 28px #1c241d44}.cart.show{display:flex}.cart small{display:block;margin-top:2px;color:#bac5b9}.checkout{border:0;border-radius:10px;padding:11px 15px;background:var(--orange);color:#fff;font-weight:700;white-space:nowrap;cursor:pointer}.modal-back{position:fixed;z-index:30;inset:0;display:none;background:#17211888;align-items:center;justify-content:center;padding:16px}.modal-back.show{display:flex}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:24px;padding:30px}.modal-top{display:flex;justify-content:space-between;gap:20px}.modal h2{margin:4px 0 7px;font:700 32px Fraunces,serif;letter-spacing:-1px}.modal p{margin:0;color:var(--muted);line-height:1.45}.close{border:0;background:#f1eee7;border-radius:50%;height:34px;width:34px;font-size:20px;cursor:pointer}.notice{margin:22px 0 16px;padding:12px 14px;background:#fff1e8;border-radius:12px;color:#8d3a1d;font-size:13px;line-height:1.45}.merchant-card{border:1px solid var(--line);border-radius:15px;margin-top:12px;padding:17px}.merchant-title{display:flex;justify-content:space-between;gap:10px;font-weight:700}.merchant-title span{font-size:12px;color:var(--green);background:#e9f3eb;border-radius:99px;padding:4px 8px}.line{display:flex;justify-content:space-between;gap:16px;margin-top:10px;font-size:14px;color:#536057}.subtotal{display:flex;justify-content:space-between;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-weight:700}.grand{display:flex;justify-content:space-between;font:700 21px Fraunces,serif;margin:22px 0}.pay{width:100%;border:0;border-radius:12px;padding:15px;background:var(--green);color:white;font-weight:700;font-size:15px;cursor:pointer}.fine{font-size:12px!important;text-align:center;margin-top:12px!important}.success{display:none;text-align:center;padding:30px 10px}.success h2{margin-top:12px}.check{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#e7f4e9;color:#25853d;font-size:28px}@media(max-width:680px){.shell{padding:0 18px}.top .shell{height:62px}.hero{display:block;padding:34px 0 20px}.hero h1{letter-spacing:-1.8px}.open{display:inline-block;margin-top:17px}.tabs-wrap{margin:0 -18px;padding-left:18px}.tabs{padding-right:18px}.vendor{margin-top:20px;border-radius:20px}.vendor-head{display:block}.vendor-info{padding:30px 25px}.vendor h2{font-size:37px}.photo{min-height:220px}.menu{padding:27px 18px}.items{grid-template-columns:1fr}.item{padding:14px}.modal{padding:23px 18px}.modal h2{font-size:28px}}\n\u003c/style\u003e\u003cstyle\u003e.tabs{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible!important}.tab{white-space:normal!important;min-width:0}.tabs-wrap{overflow:visible}.top .shell{min-height:72px;height:auto;padding-top:12px;padding-bottom:12px}.brand{font-size:24px}.product-photo{height:230px;object-fit:cover}.product-copy{padding:18px}@media(max-width:800px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.product-photo{height:220px}}\u003c/style\u003e\u003c/head\u003e\n\u003cbody\u003e\n\u003cheader class=\"top\"\u003e\u003cdiv class=\"shell\"\u003e\u003cdiv class=\"brand-lockup\"\u003e\u003cdiv class=\"brand\"\u003ePlaz\u003ci\u003ea\u003c/i\u003e\u003c/div\u003e\u003cdiv class=\"powered-by\"\u003ePowered by Sazon\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"loc\"\u003e\u2316 SJSU Friday Food Court\u003c/div\u003e\u003c/div\u003e\u003c/header\u003e\n\u003cmain class=\"shell\"\u003e\u003csection class=\"hero\"\u003e\u003cdiv\u003e\u003cdiv class=\"eyebrow\"\u003eSan Jos\u00e9 \u00b7 Today, 11am\u20133pm\u003c/div\u003e\u003ch1\u003eYour lunch break,\u003cbr\u003emade delicious.\u003c/h1\u003e\u003cp\u003eOrder from your local favorites and skip the line.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"open\"\u003e\u003cspan class=\"dot\"\u003e\u003c/span\u003e4 merchants open now \u00b7 3 food + 1 retail\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"tabs-wrap\"\u003e\u003cnav class=\"tabs\"\u003e\u003cbutton class=\"tab active\" data-vendor=\"tacos\"\u003e\ud83c\udf2e Tacos El Sol\u003c/button\u003e\u003cbutton class=\"tab\" data-vendor=\"arepas\"\u003e\ud83e\uded3 Arepas Co.\u003c/button\u003e\u003cbutton class=\"tab\" data-vendor=\"curry\"\u003e\ud83c\udf5b Curry Cart\u003c/button\u003e\u003cbutton class=\"tab\" data-vendor=\"jewelry\"\u003eLuna Bijouterie \u00b7 Jewelry retailer\u003c/button\u003e\u003c/nav\u003e\u003c/div\u003e\u003csection class=\"vendor\" id=\"vendor\"\u003e\u003cdiv class=\"menu\"\u003e\u003ch2\u003eTacos El Sol\u003c/h2\u003e\u003cdiv class=\"items\"\u003e\u003cdiv class=\"item\"\u003e\u003cimg class=\"product-photo\" src=\"https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/0931545b-144a-5830-80cc-4b5e27083df3/490da9c1-ab4c-51d7-9e8f-d903de60066c.jpg\" alt=\"Representative photograph of Birria Tacos\"\u003e\u003cdiv class=\"product-copy\"\u003e\u003cdiv class=\"item-name\"\u003eBirria Tacos\u003c/div\u003e\u003csmall\u003eRepresentative product photograph\u003c/small\u003e\u003cdiv class=\"product-buy\"\u003e\u003cstrong\u003e$14.00\u003c/strong\u003e\u003cbutton disabled\u003eLoading ordering\u2026\u003c/button\u003e\u003c/div\u003e\u003ca class=\"source\" href=\"https://www.recipetineats.com/birria-tacos/\" target=\"_blank\" rel=\"noopener\"\u003ePhoto source\u003c/a\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"item\"\u003e\u003cimg class=\"product-photo\" src=\"https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/0d9a92e2-2db4-52d5-a646-cf9b51d49d77/5ef78555-71f2-5e9a-ac3d-69b8a2d32288.jpg\" alt=\"Representative photograph of Carne Asada Burrito\"\u003e\u003cdiv class=\"product-copy\"\u003e\u003cdiv class=\"item-name\"\u003eCarne Asada Burrito\u003c/div\u003e\u003csmall\u003eRepresentative product photograph\u003c/small\u003e\u003cdiv class=\"product-buy\"\u003e\u003cstrong\u003e$16.00\u003c/strong\u003e\u003cbutton disabled\u003eLoading ordering\u2026\u003c/button\u003e\u003c/div\u003e\u003ca class=\"source\" href=\"https://carneandpapas.com/carne-asada-burrito/\" target=\"_blank\" rel=\"noopener\"\u003ePhoto source\u003c/a\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"item\"\u003e\u003cimg class=\"product-photo\" src=\"https://st.perplexity.ai/estatic/0b226c450798410ac541646c86ec31afd840e5beab817a5d84fa821e7db61981ec84c3b4a3f072a7a2e1899c9fb06c6e45b023e33dcddb2178fb89d8d04edf39d423668ea867199eff356f142aff192a81302bf50ba1900f466f6e0bccbbf329afc58264972d02db13098d25dad9d70f\" alt=\"Representative photograph of Horchata\"\u003e\u003cdiv class=\"product-copy\"\u003e\u003cdiv class=\"item-name\"\u003eHorchata\u003c/div\u003e\u003csmall\u003eRepresentative product photograph\u003c/small\u003e\u003cdiv class=\"product-buy\"\u003e\u003cstrong\u003e$4.00\u003c/strong\u003e\u003cbutton disabled\u003eLoading ordering\u2026\u003c/button\u003e\u003c/div\u003e\u003ca class=\"source\" href=\"https://www.vecteezy.com/photo/3606787-fresh-horchata-with-cinnamon-in-glass\" target=\"_blank\" rel=\"noopener\"\u003ePhoto source\u003c/a\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\u003c/main\u003e\n\u003cdiv class=\"cart\" id=\"cart\"\u003e\u003cdiv\u003e\u003cstrong id=\"cartCount\"\u003e0 items\u003c/strong\u003e\u003csmall id=\"cartDetail\"\u003e0 vendors\u003c/small\u003e\u003c/div\u003e\u003cbutton class=\"checkout\" id=\"checkout\"\u003eReview order \u00b7 \u003cspan id=\"cartTotal\"\u003e$0.00\u003c/span\u003e\u003c/button\u003e\u003c/div\u003e\n\u003cdiv class=\"modal-back\" id=\"modal\"\u003e\u003csection class=\"modal\"\u003e\u003cdiv id=\"review\"\u003e\u003cdiv class=\"modal-top\"\u003e\u003cdiv\u003e\u003cdiv class=\"eyebrow\"\u003ePlaza order FC-100184\u003c/div\u003e\u003ch2\u003eReview your order\u003c/h2\u003e\u003cp\u003eOne food-court summary. Each vendor processes and fulfills its own purchase.\u003c/p\u003e\u003c/div\u003e\u003cbutton class=\"close\" id=\"close\"\u003e\u00d7\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"notice\"\u003eYour card will be charged separately by each vendor below. Sales tax and merchant receipts are calculated and issued by the vendor for their items.\u003c/div\u003e\u003cdiv id=\"summary\"\u003e\u003c/div\u003e\u003cdiv class=\"grand\"\u003e\u003cspan\u003eTotal across vendors\u003c/span\u003e\u003cspan id=\"grandTotal\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cbutton class=\"pay\" id=\"pay\"\u003ePlace separate vendor orders\u003c/button\u003e\u003cp class=\"fine\"\u003eBy placing the order, you make separate purchases directly from the vendors shown above. Plaza provides ordering software and the combined order summary. Powered by Sazon.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"success\" id=\"success\"\u003e\u003cdiv class=\"check\"\u003e\u2713\u003c/div\u003e\u003ch2\u003eOrders sent to the kitchens\u003c/h2\u003e\u003cp id=\"successText\"\u003e\u003c/p\u003e\u003cbutton class=\"pay\" style=\"margin-top:22px\" onclick=\"location.reload()\"\u003eBack to Plaza\u003c/button\u003e\u003c/div\u003e\u003c/section\u003e\u003c/div\u003e\n\u003cscript\u003e\nconst vendors={tacos:{name:'Tacos El Sol',type:'Mexican street food',time:'10\u201315 min',photo:'https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/10d86927-b5a6-5c29-8306-ad7fd7ff2560/92c71b4c-4612-5e23-897c-3ac3bb8640a9.jpg',desc:'Slow-braised birria, handmade tortillas, and bright, punchy salsa.',items:[['Birria Tacos','Three tacos, consomm\u00e9, onion & cilantro',14],['Carne Asada Burrito','Beans, rice, pico & salsa roja',16],['Chips + Guac','Fresh avocado, lime, sea salt',7],['Horchata','House-made cinnamon rice milk',4]]},arepas:{name:'Arepas Co.',type:'Venezuelan comfort food',time:'12\u201318 min',photo:'https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/cdabe0fe-7d4c-5078-ae35-c27752f22b66/923897ce-abc5-5d59-a523-a7d97bf7271b.jpg',desc:'Golden corn arepas stuffed fresh to order with vibrant, generous fillings.',items:[['Reina Pepiada','Chicken, avocado, cilantro & mayo',13],['Pabell\u00f3n Arepa','Shredded beef, black beans & plantains',14],['Cheese Arepa','Melted queso blanco',9],['Passionfruit Juice','Bright, chilled, trop c/body\u003e\u003c/html\u003e";admin.srcdoc="\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cmeta charset=\"UTF-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\u003ctitle\u003ePlaza \u00b7 Powered By Sazon\u003c/title\u003e\n\u003cstyle\u003e\n:root{--brand:#24634e;--ink:#202a26;--muted:#68736b;--bg:#faf7ee;--line:#e4e5dc}*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}header{background:white;border-bottom:1px solid var(--line)}.wrap{max-width:1160px;margin:auto;padding:0 24px}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:80px}.logo{font:700 25px Georgia,serif}.powered{font:12px system-ui;color:var(--muted);display:block;margin-top:5px}.switch{display:flex;gap:6px}.btn{border:1px solid var(--line);border-radius:10px;background:white;padding:10px 15px;color:var(--ink);font-weight:600}.primary{background:var(--brand);color:white;border-color:var(--brand)}.hero{padding:35px 0 24px}.eyebrow{font-size:11px;letter-spacing:1.7px;text-transform:uppercase;color:var(--brand);font-weight:800}h1{font:700 44px Georgia,serif;letter-spacing:-1.5px;margin:12px 0}h2{font:700 27px Georgia,serif;margin:0 0 12px}h3{margin:0 0 10px;font-size:17px}p{line-height:1.6;color:var(--muted)}.notice{padding:12px 16px;border-radius:12px;background:#fff0ce;color:#705214;font-size:13px;margin:18px 0}.layout{display:grid;grid-template-columns:270px 1fr;gap:22px;padding-bottom:50px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:24px}.side .step{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:0;border-radius:10px;background:#f6f7f1;color:var(--muted)}.step.active{background:#e7f1e9;color:var(--brand);font-weight:700}.badge{display:inline-block;border-radius:30px;background:#e8f3e9;color:#2b6444;font-size:12px;padding:5px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:13px;font-weight:650;margin:14px 0 7px}input,select{width:100%;padding:11px;border:1px solid #d6ddd5;border-radius:9px;background:white;color:var(--ink)}input[type=checkbox]{width:auto;margin-right:8px;accent-color:var(--brand)}.check{display:flex;align-items:flex-start;line-height:1.5;font-weight:400}.help{font-size:12px;color:var(--muted);margin:6px 0 12px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}.status{border:1px solid var(--line);background:#f7faf6;padding:16px;border-radius:12px;margin:18px 0}.hidden{display:none!important}.merchant{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding:16px 0}.small{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:10px;overflow:auto;margin:20px 0}.tab{white-space:nowrap;border:1px solid var(--line);border-radius:30px;padding:12px 20px;background:white}.tab.selected{background:var(--brand);color:white}.menuhero{padding:30px;background:linear-gradient(120deg,#e8efe2,#fff5e4);border-radius:14px;margin-bottom:22px}.items{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid var(--line);border-radius:13px;padding:18px}.item strong{display:block;margin-bottom:7px}footer{text-align:center;padding:25px;color:var(--muted);font-size:12px}code{font-size:12px;overflow-wrap:anywhere}.tone{color:var(--brand)}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:flex;gap:5px;overflow:auto;padding:10px}.side .step{min-width:140px;margin:0}.grid,.items{grid-template-columns:1fr}.bar{flex-wrap:wrap;padding:15px 0}h1{font-size:34px}.wrap{padding:0 16px}.panel{padding:20px}}\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003cheader\u003e\u003cdiv class=\"wrap bar\"\u003e\u003cdiv class=\"logo\"\u003e\u003cspan id=\"brandTitle\"\u003eLuna Night Market Plaza\u003c/span\u003e\u003cspan class=\"powered\"\u003ePowered By Sazon\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"switch\"\u003e\u003cbutton class=\"btn primary\" id=\"adminBtn\" onclick=\"showView('admin')\"\u003eVendor administration\u003c/button\u003e\u003cbutton class=\"btn\" id=\"publicBtn\" onclick=\"showView('public')\"\u003ePreview landing page\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\u003c/header\u003e\n\u003cmain class=\"wrap\"\u003e\u003cdiv class=\"notice\"\u003eInteractive design prototype. Profile lookups, authorization, menu imports, and webhook deliveries are simulated. No real Sazon account is accessed or changed.\u003c/div\u003e\n\u003csection id=\"admin\"\u003e\u003cdiv class=\"hero\"\u003e\u003cdiv class=\"eyebrow\"\u003eSazon Plaza / Event workspace\u003c/div\u003e\u003ch1\u003eYour event. Your brand.\u003c/h1\u003e\u003cp\u003eVendor = event organizer or administrator. Merchant = food operator or retailer leasing space in your event.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"layout\"\u003e\u003caside class=\"panel side\"\u003e\u003cbutton class=\"step active\" data-step=\"brand\" onclick=\"step('brand')\"\u003e01 \u00b7 Vendor brand\u003c/button\u003e\u003cbutton class=\"step\" data-step=\"connect\" onclick=\"step('connect')\"\u003e02 \u00b7 Connect merchant\u003c/button\u003e\u003cbutton class=\"step\" data-step=\"sync\" onclick=\"step('sync')\"\u003e03 \u00b7 Synchronize\u003c/button\u003e\u003cbutton class=\"step\" data-step=\"manage\" onclick=\"step('manage')\"\u003e04 \u00b7 Manage merchants\u003c/button\u003e\u003cbutton class=\"step\" data-step=\"ops\" onclick=\"step('ops');drawOps()\"\u003e05 \u00b7 Merchant Administration\u003c/button\u003e\u003c/aside\u003e\u003cdiv\u003e\n\u003csection class=\"panel pane\" id=\"brand\"\u003e\u003ch2\u003ePublish under your event brand\u003c/h2\u003e\u003cp\u003eYour vendor brand names the Plaza. Each participating merchant keeps its own identity and menu.\u003c/p\u003e\u003cdiv class=\"grid\"\u003e\u003cdiv\u003e\u003clabel for=\"eventName\"\u003eVendor / event brand\u003c/label\u003e\u003cinput id=\"eventName\" value=\"Luna Night Market\" maxlength=\"80\"\u003e\u003c/div\u003e\u003cdiv\u003e\u003clabel for=\"eventColor\"\u003eBrand accent\u003c/label\u003e\u003cinput id=\"eventColor\" type=\"color\" value=\"#24634e\"\u003e\u003c/div\u003e\u003cdiv\u003e\u003clabel for=\"eventPlace\"\u003eEvent location\u003c/label\u003e\u003cinput id=\"eventPlace\" value=\"San Jos\u00e9, California\"\u003e\u003c/div\u003e\u003cdiv\u003e\u003clabel for=\"eventHours\"\u003ePublic hours\u003c/label\u003e\u003cinput id=\"eventHours\" value=\"Friday \u00b7 5\u201310 PM\"\u003e\u003c/div\u003e\u003cdiv\u003e\u003clabel for=\"contact\"\u003eVendor administrator email\u003c/label\u003e\u003cinput id=\"contact\" type=\"email\" placeholder=\"admin@your-event.com\"\u003e\u003c/div\u003e\u003cdiv\u003e\u003clabel for=\"domain\"\u003ePreferred custom domain (request only)\u003c/label\u003e\u003cinput id=\"domain\" placeholder=\"order.your-event.com\"\u003e\u003c/div\u003e\u003c/div\u003e\u003cp class=\"help\"\u003eDomain verification and DNS setup require the production service. This prototype does not publish a site or provision a domain.\u003c/p\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton class=\"btn primary\" onclick=\"saveBrand()\"\u003eApply brand & connect a merchant \u2192\u003c/button\u003e\u003c/div\u003e\u003c/section\u003e\n\u003csection class=\"panel pane hidden\" id=\"connect\"\u003e\u003ch2\u003eBring a merchant\u2019s Sazon menu over\u003c/h2\u003e\u003cp\u003eAsk the merchant for their existing Sazon ID. Import their profile menu; do not re-enter products or prices.\u003c/p\u003e\u003clabel for=\"sazonId\"\u003eMerchant\u2019s Sazon ID\u003c/label\u003e\u003cinput id=\"sazonId\" placeholder=\"Try SAZ-DEMO-001\" autocomplete=\"off\"\u003e\u003cp class=\"help\"\u003eDemo: SAZ-DEMO-001 = ready profile; SAZ-DEMO-002 = incomplete onboarding. Any other ID is not found in this demo.\u003c/p\u003e\u003clabel for=\"merchantEmail\"\u003eMerchant account contact email\u003c/label\u003e\u003cinput id=\"merchantEmail\" type=\"email\" placeholder=\"owner@merchant.com\"\u003e\u003cp class=\"help\"\u003eProduction must verify the account through Sazon authorization. An ID or matching email alone is not authorization.\u003c/p\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\" id=\"permission\"\u003eI have permission to invite this merchant to the event. The account owner must approve profile and menu access.\u003c/label\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton class=\"btn primary\" id=\"lookupBtn\" onclick=\"lookup()\"\u003eCheck profile & connection readiness\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"profileResult\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cdiv class=\"status\"\u003e\u003cstrong\u003eMerchant does not have a Sazon profile?\u003c/strong\u003e\u003cp\u003eCreate or complete their account first, then return here with their Sazon ID.\u003c/p\u003e\u003cbutton class=\"btn\" onclick=\"onboard()\"\u003eMerchant onboarding instructions \u2197\u003c/button\u003e\u003c/div\u003e\u003c/section\u003e\n\u003csection class=\"panel pane hidden\" id=\"sync\"\u003e\u003ch2\u003eAuthorize & synchronize\u003c/h2\u003e\u003cp id=\"selectedProfile\"\u003eSelect a merchant profile first.\u003c/p\u003e\u003cdiv class=\"grid\"\u003e\u003cdiv\u003e\u003clabel for=\"profileLocation\"\u003eWhich merchant location/menu?\u003c/label\u003e\u003cselect id=\"profileLocation\"\u003e\u003coption value=\"truck\"\u003eFood truck \u00b7 Main menu\u003c/option\u003e\u003coption value=\"popup\"\u003ePop-up \u00b7 Event menu\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\u003cdiv\u003e\u003clabel for=\"pickup\"\u003eMerchant pickup / stall label\u003c/label\u003e\u003cinput id=\"pickup\" value=\"Stall A-04\" maxlength=\"80\"\u003e\u003c/div\u003e\u003cdiv\u003e\u003clabel for=\"syncStart\"\u003eWhen should the merchant appear?\u003c/label\u003e\u003cselect id=\"syncStart\"\u003e\u003coption\u003eImmediately after successful import\u003c/option\u003e\u003coption\u003eKeep unpublished until vendor approves\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\u003cdiv\u003e\u003clabel for=\"closedMode\"\u003eWhen merchant is closed\u003c/label\u003e\u003cselect id=\"closedMode\"\u003e\u003coption\u003eHide closed merchants from patrons\u003c/option\u003e\u003c/select\u003e\u003c/div\u003e\u003c/div\u003e\u003clabel\u003eWhat should stay synchronized?\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\" id=\"menuScope\" checked\u003eMenu categories, items, descriptions, and prices (required)\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\" id=\"availabilityScope\" checked\u003eSold-out items and item availability\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\" id=\"hoursScope\" checked\u003eMerchant operating status and hours\u003c/label\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\" id=\"profileScope\" checked\u003eMerchant display name and profile branding\u003c/label\u003e\u003cdiv class=\"status\"\u003e\u003cstrong\u003eManaged webhook connection\u003c/strong\u003e\u003cp\u003eThe production backend generates the destination, registers supported subscriptions, stores the signing secret securely, and verifies incoming signatures. Merchants should not paste secrets into this page.\u003c/p\u003e\u003cspan class=\"small\"\u003eProposed events below are adapter requirements, not verified Sazon API event names.\u003c/span\u003e\u003cp\u003e\u003ccode\u003emenu.updated \u00b7 item.availability_changed \u00b7 location.status_changed \u00b7 merchant.updated\u003c/code\u003e\u003c/p\u003e\u003c/div\u003e\u003clabel class=\"check\"\u003e\u003cinput type=\"checkbox\" id=\"authorize\"\u003eDemo only: simulate the merchant account owner granting read access and webhook synchronization for this event. Production requires authenticated authorization.\u003c/label\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton class=\"btn\" onclick=\"step('connect')\"\u003eBack\u003c/button\u003e\u003cbutton class=\"btn primary\" id=\"syncBtn\" onclick=\"synchronize()\"\u003eAuthorize & synchronize menu\u003c/button\u003e\u003c/div\u003e\u003cdiv id=\"syncResult\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003c/section\u003e\n\u003csection class=\"panel pane hidden\" id=\"ops\"\u003e\u003ch2\u003eMerchant Administration\u003c/h2\u003e\u003cp\u003eEvery selection applies immediately to the Patron View.\u003c/p\u003e\u003clabel for=\"opsSelect\"\u003eMerchant\u003c/label\u003e\u003cselect id=\"opsSelect\" onchange=\"drawOps(this.value)\"\u003e\u003c/select\u003e\u003cdiv id=\"opsFields\"\u003e\u003c/div\u003e\u003cp id=\"opsMessage\" role=\"status\"\u003e\u003c/p\u003e\u003c/section\u003e\u003csection class=\"panel pane hidden\" id=\"manage\"\u003e\u003ch2\u003eMerchants & connection health\u003c/h2\u003e\u003cp\u003eEvent-branded destination; merchant-owned menus. No payments or tax processing are connected in this prototype.\u003c/p\u003e\u003cdiv id=\"merchantList\"\u003e\u003c/div\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton class=\"btn\" onclick=\"step('connect')\"\u003e+ Connect another merchant\u003c/button\u003e\u003cbutton class=\"btn primary\" onclick=\"showView('public')\"\u003ePreview your Plaza \u2192\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"status\"\u003e\u003cstrong\u003eTry a webhook-style update\u003c/strong\u003e\u003cp\u003eSimulate a merchant marking their first menu item sold out. The public menu and connection timestamp update without re-entering the menu.\u003c/p\u003e\u003cbutton class=\"btn\" onclick=\"simulateEvent()\"\u003eSimulate availability event\u003c/button\u003e\u003c/div\u003e\u003cdetails\u003e\u003csummary\u003eProduction integration checklist\u003c/summary\u003e\u003cp\u003eAuthenticated vendor workspace; merchant-owner consent; actual profile lookup and onboarding URL; subscription registration; server-side signature verification; event deduplication; version-aware updates; retry/dead-letter queue; periodic reconciliation; persistent database; access revocation; tenant isolation; audit log. Browser code must never hold API keys or signing secrets.\u003c/p\u003e\u003c/details\u003e\u003c/section\u003e\n\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\n\u003csection id=\"public\" class=\"hidden\"\u003e\u003cdiv class=\"hero\"\u003e\u003cdiv class=\"eyebrow\" id=\"publicMeta\"\u003eSan Jos\u00e9, California \u00b7 Friday \u00b7 5\u201310 PM\u003c/div\u003e\u003ch1 id=\"publicHeading\"\u003eWelcome to Luna Night Market Plaza.\u003c/h1\u003e\u003cp\u003eDiscover the merchants. Find your favorite. Enjoy the night.\u003c/p\u003e\u003c/div\u003e\u003cnav class=\"tabs\" id=\"publicTabs\" aria-label=\"Merchant menus\"\u003e\u003c/nav\u003e\u003csection class=\"panel\" id=\"publicMenu\"\u003e\u003c/section\u003e\u003cp class=\"small\"\u003ePreview only \u00b7 Prices and availability are sample data. Ordering is not connected.\u003c/p\u003e\u003c/section\u003e\n\u003cfooter\u003e\u003cspan id=\"footerBrand\"\u003eLuna Night Market Plaza\u003c/span\u003e \u00b7 Powered By Sazon\u003c/footer\u003e\u003c/main\u003e\n\u003cdialog id=\"onboardDialog\" style=\"max-width:540px;border:1px solid #ddd;border-radius:18px;padding:26px\"\u003e\u003ch2\u003eComplete Sazon onboarding\u003c/h2\u003e\u003cp\u003eAsk the merchant to create or complete their profile, publish a menu, and authorize this event connection. Then return to Plaza and enter their Sazon ID.\u003c/p\u003e\u003clabel for=\"onboardURL\"\u003eOfficial Sazon onboarding URL\u003c/label\u003e\u003cinput id=\"onboardURL\" type=\"url\" placeholder=\"Paste your verified onboarding URL\"\u003e\u003cp class=\"help\"\u003eNo onboarding route was supplied. Configure the real route here; this prototype will not invent a destination.\u003c/p\u003e\u003cdiv class=\"actions\"\u003e\u003cbutton class=\"btn\" onclick=\"document.querySelector('#onboardDialog').close()\"\u003eClose\u003c/button\u003e\u003cbutton class=\"btn primary\" onclick=\"openOnboarding()\"\u003eOpen onboarding \u2197\u003c/button\u003e\u003c/div\u003e\u003cp class=\"small\" id=\"onboardError\"\u003e\u003c/p\u003e\u003c/dialog\u003e\n\u003cscript\u003e\nconst $=id=\u003edocument.getElementById(id);let selected=null,activeMerchant=0;const merchants=[];\nconst profiles={'SAZ-DEMO-001':{id:'SAZ-DEMO-001',name:'Tacos El Sol',ready:true},'SAZ-DEMO-002':{id:'SAZ-DEMO-002',name:'Arepas Co.',ready:false}};\nconst esc=s=\u003eString(s).replace(/[&\u003c\u003e\"']/g,c=\u003e({'&':'&amp;','\u003c':'&lt;','\u003e':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction step(id){document.querySelectorAll('.pane').forEach(p=\u003ep.classList.toggle('hidden',p.id!==id));document.querySelectorAll('.step').forEach(b=\u003eb.classList.toggle('active',b.dataset.step===id));if(id==='manage')renderMerchants()}\nfunction showView(v){$('admin').classList.toggle('hidden',v!=='admin');$('public').classList.toggle('hidden',v!=='public');$('adminBtn').classList.toggle('primary',v==='admin');$('publicBtn').classList.toggle('primary',v==='public');if(v==='public')renderPublic()}\nfunction saveBrand(){const n=$('eventName').value.trim();if(!n)return alert('Enter the vendor / event brand.');const title=n+' Plaza';$('brandTitle').textContent=title;$('footerBrand').textContent=title;$('publicHeading').textContent='Welcome to '+title+'.';$('publicMeta').textContent=$('eventPlace').value+' \u00b7 '+$('eventHours').value;document.documentElement.style.setProperty('--brand',$('eventColor').value);step('connect')}\nfunction lookup(){selected=null;if(!$('permission').checked)return alert('Confirm permission to invite the merchant.');if(!$('merchantEmail').value||!$('merchantEmail').checkValidity())return alert('Enter a valid merchant contact email.');let id=$('sazonId').value.trim().toUpperCase();let p=profiles[id];if(!p){$('profileResult').innerHTML='\u003cdiv class=\"status\"\u003e\u003cstrong\u003eProfile not found in demo\u003c/strong\u003e\u003cp\u003eCheck the merchant ID or direct the merchant to onboarding. No automatic connection was created.\u003c/p\u003e\u003cbutton class=\"btn\" onclick=\"onboard()\"\u003eGo to onboarding instructions \u2197\u003c/button\u003e\u003c/div\u003e';return}if(!p.ready){$('profileResult').innerHTML='\u003cdiv class=\"status\"\u003e\u003cstrong\u003e'+esc(p.name)+' \u00b7 onboarding incomplete\u003c/strong\u003e\u003cp\u003eSample profile has no published menu. Ask the merchant to complete onboarding and publish their menu before synchronization.\u003c/p\u003e\u003cbutton class=\"btn\" onclick=\"onboard()\"\u003eComplete onboarding \u2197\u003c/button\u003e\u003c/div\u003e';return}selected={...p};$('profileResult').innerHTML='\u003cdiv class=\"status\"\u003e\u003cspan class=\"badge\"\u003eDemo profile found\u003c/span\u003e\u003ch3 style=\"margin-top:14px\"\u003e'+esc(p.name)+'\u003c/h3\u003e\u003cp\u003ePublished menu available. Owner authorization required before import.\u003c/p\u003e\u003cbutton class=\"btn primary\" onclick=\"step(\\'sync\\')\"\u003eConfigure automatic synchronization \u2192\u003c/button\u003e\u003c/div\u003e';$('selectedProfile').textContent=p.name+' \u00b7 '+p.id+' \u00b7 Merchant-owned Sazon profile';$('syncResult').innerHTML='';$('authorize').checked=false}\nfunction onboard(){$('onboardDialog').showModal()}\nfunction openOnboarding(){try{const u=new URL($('onboardURL').value);if(u.protocol!=='https:')throw Error();window.open(u.href,'_blank','noopener,noreferrer');$('onboardError').textContent='Opened the configured onboarding destination. Return with the merchant ID.'}catch(e){$('onboardError').textContent='Configure a valid, verified HTTPS onboarding URL first.'}}\nasync function synchronize(){if(!selected)return alert('Look up a ready merchant profile first.');if(!$('menuScope').checked)return alert('Menu synchronization is required.');if(!$('authorize').checked)return alert('Simulate merchant-owner authorization first.');if(!$('pickup').value.trim())return alert('Enter a pickup / stall label.');$('syncBtn').disabled=true;$('syncResult').innerHTML='\u003cdiv class=\"status\"\u003eSimulating owner authorization \u2192 importing menu \u2192 registering subscriptions \u2192 checking connection\u2026\u003c/div\u003e';await new Promise(r=\u003esetTimeout(r,800));const m={...selected,stall:$('pickup').value.trim(),menuLocation:$('profileLocation').value,published:$('syncStart').selectedIndex===0,availability:$('availabilityScope').checked,lastSync:new Date().toLocaleString(),items:[{name:'Birria Tacos',desc:'Three tacos with consomm\u00e9, onion & cilantro',price:14,available:true},{name:'Carne Asada Burrito',desc:'Rice, beans, pico & salsa roja',price:16,available:true},{name:'Horchata',desc:'Cinnamon rice milk',price:4,available:true}]};let i=merchants.findIndex(x=\u003ex.id===m.id);if(i\u003e=0)merchants[i]=m;else merchants.push(m);$('syncResult').innerHTML='\u003cdiv class=\"status\"\u003e\u003cspan class=\"badge\"\u003eDemo synchronization complete\u003c/span\u003e\u003cp\u003e3 items imported. Managed subscriptions simulated; no real endpoint was registered.\u003c/p\u003e\u003cbutton class=\"btn primary\" onclick=\"step(\\'manage\\')\"\u003eManage connected merchants \u2192\u003c/button\u003e\u003c/div\u003e';$('syncBtn').disabled=false;renderMerchants()}\nfunction renderMerchants(){$('merchantList').innerHTML=merchants.length?merchants.map((m,i)=\u003e'\u003cdiv class=\"merchant\"\u003e\u003cdiv\u003e\u003cstrong\u003e'+esc(m.name)+'\u003c/strong\u003e\u003cp class=\"small\"\u003e'+esc(m.id)+' \u00b7 '+esc(m.stall)+'\u003cbr\u003eDemo sync: '+esc(m.lastSync)+'\u003cbr\u003e'+ (m.published?'Published':'Unpublished')+' \u00b7 '+(m.open===false?'Closed \u2014 hidden from patrons':'Open')+'\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cbutton class=\"btn\" onclick=\"togglePublish('+i+')\"\u003e'+(m.published?'Unpublish':'Publish')+'\u003c/button\u003e \u003cbutton class=\"btn\" onclick=\"disconnect('+i+')\"\u003eDisconnect\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e').join(''):'\u003cdiv class=\"status\"\u003eNo merchants connected yet. Enter SAZ-DEMO-001 to try the complete connection flow.\u003c/div\u003e'}\nfunction togglePublish(i){merchants[i].published=!merchants[i].published;renderMerchants()}\nfunction disconnect(i){if(confirm('Disconnect this merchant and remove their menu from this Plaza preview?')){merchants.splice(i,1);renderMerchants();renderPublic()}}\nfunction simulateEvent(){const m=merchants.find(x=\u003ex.availability);if(!m)return alert('Connect a merchant with availability synchronization enabled.');m.items[0].available=!m.items[0].available;m.lastSync=new Date().toLocaleString();renderMerchants();renderPublic();alert('Simulated availability event applied. View the landing page to see the change.')}\nfunction renderPublic(){const shown=merchants.filter(x=\u003ex.published&&x.open!==false);if(!shown.length){$('publicTabs').innerHTML='';$('publicMenu').innerHTML='\u003ch2\u003eMerchants coming soon\u003c/h2\u003e\u003cp\u003eThe vendor has not published any merchants yet. Connect a ready Sazon profile and publish it from administration.\u003c/p\u003e';return}if(activeMerchant\u003e=shown.length)activeMerchant=0;$('publicTabs').innerHTML=shown.map((m,i)=\u003e'\u003cbutton class=\"tab '+(i===activeMerchant?'selected':'')+'\" onclick=\"activeMerchant='+i+';renderPublic()\"\u003e'+esc(m.name)+'\u003c/button\u003e').join('');const m=shown[activeMerchant];$('publicMenu').innerHTML='\u003cdiv class=\"menuhero\"\u003e\u003cspan class=\"badge\"\u003eConnected menu \u00b7 demo\u003c/span\u003e\u003ch2 style=\"margin-top:18px\"\u003e'+esc(m.name)+'\u003c/h2\u003e\u003cp\u003ePickup: '+esc(m.stall)+' \u00b7 '+esc(m.menuLocation==='truck'?'Main menu':'Event menu')+'\u003c/p\u003e\u003c/div\u003e\u003ch3\u003eMerchant menu\u003c/h3\u003e\u003cdiv class=\"items\"\u003e'+m.items.map(x=\u003e'\u003cdiv class=\"item\"\u003e\u003cstrong\u003e'+esc(x.name)+'\u003c/strong\u003e\u003cp class=\"small\"\u003e'+esc(x.desc)+'\u003c/p\u003e\u003cdiv style=\"display:flex;justify-content:space-between;align-items:center\"\u003e\u003cspan\u003e$'+x.price.toFixed(2)+'\u003c/span\u003e\u003cbutton class=\"btn\" disabled\u003e'+(x.available?'Ordering not connected':'Sold out')+'\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e').join('')+'\u003c/div\u003e\u003cp class=\"small\"\u003eMenu source: '+esc(m.id)+' \u00b7 Last demo sync: '+esc(m.lastSync)+'\u003c/p\u003e'}\n\u003c/script\u003e\u003cscript\u003e\nconst seeds=[{\"id\": \"SAZ-DEMO-001\", \"name\": \"Tacos El Sol\", \"kind\": \"Food operator\", \"stall\": \"A-04\", \"ready\": true, \"published\": true, \"availability\": true, \"lastSync\": \"Demo connected\", \"items\": [{\"name\": \"Birria Tacos\", \"desc\": \"Sample merchant item\", \"price\": 14, \"available\": true}, {\"name\": \"Carne Asada Burrito\", \"desc\": \"Sample merchant item\", \"price\": 16, \"available\": true}, {\"name\": \"Horchata\", \"desc\": \"Sample merchant item\", \"price\": 4, \"available\": true}]}, {\"id\": \"SAZ-DEMO-003\", \"name\": \"Arepas Co.\", \"kind\": \"Food operator\", \"stall\": \"A-08\", \"ready\": true, \"published\": true, \"availability\": true, \"lastSync\": \"Demo connected\", \"items\": [{\"name\": \"Reina Pepiada\", \"desc\": \"Sample merchant item\", \"price\": 13, \"available\": true}, {\"name\": \"Pabell\\u00f3n Arepa\", \"desc\": \"Sample merchant item\", \"price\": 14, \"available\": true}, {\"name\": \"Passionfruit Juice\", \"desc\": \"Sample merchant item\", \"price\": 5, \"available\": true}]}, {\"id\": \"SAZ-DEMO-004\", \"name\": \"Curry Cart\", \"kind\": \"Food operator\", \"stall\": \"B-02\", \"ready\": true, \"published\": true, \"availability\": true, \"lastSync\": \"Demo connected\", \"items\": [{\"name\": \"Green Curry Bowl\", \"desc\": \"Sample merchant item\", \"price\": 14, \"available\": true}, {\"name\": \"Red Curry Chicken\", \"desc\": \"Sample merchant item\", \"price\": 15, \"available\": true}, {\"name\": \"Thai Iced Tea\", \"desc\": \"Sample merchant item\", \"price\": 4, \"available\": true}]}, {\"id\": \"SAZ-DEMO-005\", \"name\": \"Luna Bijouterie\", \"kind\": \"Bijouterie retailer\", \"stall\": \"C-06\", \"ready\": true, \"published\": true, \"availability\": true, \"lastSync\": \"Demo connected\", \"items\": [{\"name\": \"Golden Hoop Earrings\", \"desc\": \"Sample merchant item\", \"price\": 22, \"available\": true}, {\"name\": \"Beaded Bracelet\", \"desc\": \"Sample merchant item\", \"price\": 12, \"available\": true}, {\"name\": \"Moon Pendant Necklace\", \"desc\": \"Sample merchant item\", \"price\": 28, \"available\": true}]}];seeds.forEach(m=\u003e{merchants.push(structuredClone(m));profiles[m.id]=structuredClone(m)});\nfunction broadcast(){parent.postMessage({type:'adminState',brand:$('eventName').value,merchants:structuredClone(merchants)},'*')}\nconst priorSave=saveBrand;saveBrand=function(){priorSave();broadcast()};const priorToggle=togglePublish;togglePublish=function(i){priorToggle(i);broadcast()};const priorDisconnect=disconnect;disconnect=function(i){priorDisconnect(i);broadcast()};const priorEvent=simulateEvent;simulateEvent=function(){priorEvent();broadcast()};const priorSync=synchronize;synchronize=async function(){await priorSync();if(selected){const m=merchants.find(m=\u003em.id===selected.id),p=profiles[selected.id];if(m&&p.items){m.items=structuredClone(p.items);m.kind=p.kind;renderMerchants()}}broadcast()};\n$('publicBtn').onclick=()=\u003e{broadcast();parent.postMessage({type:'openPatron'},'*')};$('publicBtn').textContent='Open patron ordering';$('profileLocation').innerHTML='\u003coption\u003eMain menu / product catalog\u003c/option\u003e\u003coption\u003eEvent menu / catalog\u003c/option\u003e';renderMerchants();broadcast();\n\u003c/script\u003e\u003cscript\u003efunction liveBrand(){const brand=$('eventName').value.trim();$('brandTitle').textContent=brand+' Plaza';$('footerBrand').textContent=brand+' Plaza';document.title=brand+' Plaza, Powered By Sazon';broadcast();}$('eventName').addEventListener('input',liveBrand);$('eventName').addEventListener('change',liveBrand);liveBrand();\u003c/script\u003e\u003cscript\u003e\nconst localityNames={'table-12':'Garden seating \u00b7 Table 12','table-08':'Covered seating \u00b7 Table 08','lounge-03':'Market lounge \u00b7 Seat 03'};let opsId=null;const storeKey='plaza-reliable-sync-v3';\nfunction normalize(m){if(typeof m.open!=='boolean')m.open=true;if(!Array.isArray(m.delivery))m.delivery=Object.keys(localityNames)}\ntry{const d=JSON.parse(parent.localStorage.getItem(storeKey));if(d&&Array.isArray(d.merchants)){merchants.splice(0,merchants.length,...d.merchants);['eventName','eventPlace','eventHours','eventColor'].forEach((id,i)=\u003e{const v=d[['brand','place','hours','color'][i]];if(typeof v==='string')$(id).value=v})}}catch(e){}\nmerchants.forEach(normalize);\nfunction commitOps(){const m=merchants.find(m=\u003em.id===opsId);if(!m||!$('opsOpen'))return;m.open=$('opsOpen').checked;m.stall=$('opsStall').value.trim()||m.stall;$('opsFields').querySelectorAll('[data-item]').forEach(c=\u003em.items[+c.dataset.item].available=c.checked);m.delivery=[...$('opsFields').querySelectorAll('[data-locality]:checked')].map(c=\u003ec.dataset.locality)}\nwindow.exportPlazaState=function(){commitOps();merchants.forEach(normalize);return {brand:$('eventName').value,place:$('eventPlace').value,hours:$('eventHours').value,color:$('eventColor').value,merchants:structuredClone(merchants)}};\nbroadcast=function(){const data=window.exportPlazaState();let stored=true;try{parent.localStorage.setItem(storeKey,JSON.stringify(data))}catch(e){stored=false}if(typeof parent.setPlazaState==='function')parent.setPlazaState(data);else parent.po
