ortant;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible!important}.tab{white-space:normal!important;min-width:0}.tabs-wrap{overflow:visible}.top .shell{min-height:72px;height:auto;padding-top:12px;padding-bottom:12px}.brand{font-size:24px}.product-photo{height:230px;object-fit:cover}.product-copy{padding:18px}@media(max-width:800px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.product-photo{height:220px}}</style></head>\n<body>\n<header class=\"top\"><div class=\"shell\"><div class=\"brand-lockup\"><div class=\"brand\">Plaz<i>a</i></div><div class=\"powered-by\">Powered by Sazon</div></div><div class=\"loc\">\u2316 SJSU Friday Food Court</div></div></header>\n<main class=\"shell\"><section class=\"hero\"><div><div class=\"eyebrow\">San Jos\u00e9 \u00b7 Today, 11am\u20133pm</div><h1>Your lunch break,<br>made delicious.</h1><p>Order from your local favorites and skip the line.</p></div><div class=\"open\"><span class=\"dot\"></span>4 merchants open now \u00b7 3 food + 1 retail</div></section><div class=\"tabs-wrap\"><nav class=\"tabs\"><button class=\"tab active\" data-vendor=\"tacos\">\ud83c\udf2e Tacos El Sol</button><button class=\"tab\" data-vendor=\"arepas\">\ud83e\uded3 Arepas Co.</button><button class=\"tab\" data-vendor=\"curry\">\ud83c\udf5b Curry Cart</button><button class=\"tab\" data-vendor=\"jewelry\">Luna Bijouterie \u00b7 Jewelry retailer</button></nav></div><section class=\"vendor\" id=\"vendor\"><div class=\"menu\"><h2>Tacos El Sol</h2><div class=\"items\"><div class=\"item\"><img class=\"product-photo\" src=\"https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/0931545b-144a-5830-80cc-4b5e27083df3/490da9c1-ab4c-51d7-9e8f-d903de60066c.jpg\" alt=\"Representative photograph of Birria Tacos\"><div class=\"product-copy\"><div class=\"item-name\">Birria Tacos</div><small>Representative product photograph</small><div class=\"product-buy\"><strong>$14.00</strong><button disabled>Loading ordering\u2026</button></div><a class=\"source\" href= `${groups.length} vendor${groups.length!==1?'s':''} \u00b7 separate purchases`;document.querySelector('#cartTotal').textContent=money(total)}function buildSummary(){const groups=Object.keys(cart).filter(k=>cart[k].length);let grand=0;document.querySelector('#summary').innerHTML=groups.map(k=>{const items=cart[k],sub=items.reduce((s,x)=>s+x.price,0),tax=sub*.09125,total=sub+tax;grand+=total;return `<div class=\"merchant-card\"><div class=\"merchant-title\"><div>${vendors[k].name}<br><small>Separate merchant order</small></div><span>Processes directly</span></div>${items.map(x=>`<div class=\"line\"><span>${x.name}</span><span>${money(x.price)}</span></div>`).join('')}<div class=\"line\"><span>Estimated sales tax</span><span>${money(tax)}</span></div><div class=\"subtotal\"><span>${vendors[k].name} subtotal</span><span>${money(total)}</span></div></div>`}).join('');document.querySelector('#grandTotal').textContent=money(grand);return groups}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{active=t.dataset.vendor;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));render()});document.querySelector('#checkout').onclick=()=>{buildSummary();document.querySelector('#modal').classList.add('show')};document.querySelector('#close').onclick=()=>document.querySelector('#modal').classList.remove('show');document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')};document.querySelector('#pay').onclick=()=>{const vendorsOrdered=buildSummary();document.querySelector('#review').style.display='none';document.querySelector('#success').style.display='block';document.querySelector('#successText').textContent=`${vendorsOrdered.length} separate vendor order${vendorsOrdered.length!==1?'s':''} have been created. You will receive a merchant receipt from each vendor.`};render();\n<\/script><style>.item{display:block;padding:0;overflow:hidden}.product-photo{width:100%;height:205px;object-fit:cover;displa fruit Juice\": [\"https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/8ba6b55c-9df1-577b-92c5-0826776b0ae1/b78aa92e-c625-50d9-b71d-47a690633236.jpg\", \"https://braziliankitchenabroad.com/how-to-make-passion-fruit-juice/\"], \"Green Curry Bowl\": [\"https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/ca9fca4a-5d27-5421-926a-f70a85242c11/2add7d98-caa4-5a41-8ee8-eac5a81dd21c.jpg\", \"https://cafedelites.com/thai-green-chicken-curry/\"], \"Red Curry Chicken\": [\"https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/e7337e0a-412b-5de8-a2c7-e2d1ef410781/eaff4a34-1fe6-53bb-9ea4-aa396504c373.jpg\", \"https://takestwoeggs.com/thai-red-curry-with-chicken/\"], \"Thai Iced Tea\": [\"https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/79983df1-a4e0-50f4-9357-0008e44f4cda/b8144c60-2fb8-5ac4-bbfc-fc07c9d3c358.jpg\", \"https://www.seriouseats.com/thai-iced-tea-recipe-8670700\"], \"Golden Hoop Earrings\": [\"https://st.perplexity.ai/estatic/0b226c450798410ac541646c86ec31afd840e5beab817a5d84fa821e7db61981ec84c3b4a3f072a7a2e1899c9fb06c6ededbbe168b33e88622e1a3fd7a294911e59591f92e4e77c64e1c17e17132c43c221f1f8279123e75b7d514442adea30e241c6e7b790cc679f36a17fc49390d1d\", \"https://anneklein.com/products/large-gold-tone-hoop-earrings\"], \"Beaded Bracelet\": [\"https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/0347374b-5128-5f28-b77a-3350edb3028f/3e8cf789-6124-5215-bbd5-ca04762847e5.jpg\", \"https://www.ebay.com/itm/185890793205\"], \"Moon Pendant Necklace\": [\"https://d2u1z1lopyfwlx.cloudfront.net/thumbnails/44f5cfd9-f596-5430-8064-4e6987972954/46cd8824-ce1b-5765-89ed-74d4194ad7c4.jpg\", \"https://www.shirepost.com/products/full-moon-silver-necklace\"]};const q=s=>document.querySelector(s),escapeHtml=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nvendors.tacos.items=vendors.tacos.items.filter(x=>x[0]!=='Chips + Guac');vendors.arepas.items=vendors.arepas.items.filter(x=>x[0]!=='Cheese Arepa');vendors.curry.items=vendors.curry.items.filter(x=>x[0]!=='Crispy Tofu Bowl');vendors.jewelry={name:'Luna Bijouterie',type:'Bijouterie retailer',time:'5\u201310 min',desc:'Fashion jewelry and local finds, delivered to your seating location.',items:[['Golden Hoop Earrings','Gold-tone fashion jewelry \u00b7 pair',22],['Beaded Bracelet','Colorful beaded jewelry',12],['Moon Pendant Necklace','Silver-tone moon pendant',28]]};\nObject.keys(vendors).forEach((k,i)=>{vendors[k].id=['SAZ-DEMO-001','SAZ-DEMO-003','SAZ-DEMO-004','SAZ-DEMO-005'][i];vendors[k].published=true;vendors[k].stall=['A-04','A-08','B-02','C-06'][i];vendors[k].unavailable=[]});\nlet eventBrand='Luna Night Market',lastPurchase=null;const locations={'table-12':'Garden seating \u00b7 Table 12','table-08':'Covered seating \u00b7 Table 08','lounge-03':'Market lounge \u00b7 Seat 03'};const scanned=new URLSearchParams(parent.location.search).get('qr');const destination=scanned?(locations[scanned]||'Invalid QR location'):locations['table-12'];const validQR=!scanned||Object.hasOwn(locations,scanned);const qr=document.createElement('div');qr.className='qrbox';qr.innerHTML='<strong>Delivery location from scanned QR</strong><p id=\"qrLocation\"></p><small>Every operator receives this destination.</small>';q('.tabs-wrap').before(qr);q('#qrLocation').textContent=destination;\nq('.brand').textContent=eventBrand+' Plaza';q('.loc').textContent='Night market \u00b7 Four merchants';q('.open').textContent='4 merchants open now \u00b7 3 food + 1 retail';q('.hero h1').textContent='A taste. A treasure. Your night.';q('.hero p').textContent='Shop food and jewelry from independent merchants in one shared cart.';\nfunction makeTabs(){const shown=Object.keys(vendors).filter(k=>vendors[k].published);q('.open').textContent=shown.length+' merchants open now \u00b7 '+shown.filter(k=>k!=='jewelry').length+' food + '+shown.filter(k=>k==='jewelry').length+' retail';q('.tabs').innerHTML=Object.keys(vendors).filter(k=>vendors[k].published).map(k=>'<button class=\"tab '+(active===k?'active':'')+'\" data-key=\"'+k+'\">'+escapeHtml(vendors[k].name)+(k==='jewelry'?' \u00b7 Jewelry retailer':'')+'</button>').join('');q('.tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.key;makeTabs();render()})}\nrender=function(){const shown=Object.keys(vendors).filter(k=>vendors[k].published);if(!shown.includes(active))active=shown[0];if(!active){q('#vendor').innerHTML='<p style=\"padding:25px\">Merchants coming soon.</p>';return}const v=vendors[active],lead=images[v.items[0][0]];q('#vendor').innerHTML='<div class=\"vendor-head\"><div class=\"vendor-info\"><div class=\"kicker\">'+escapeHtml(v.type)+' \u00b7 Connected merchant</div><h2>'+escapeHtml(v.name)+'</h2><p class=\"desc\">'+escapeHtml(v.desc)+'</p><div class=\"facts\">Stall '+escapeHtml(v.stall)+' \u00b7 Delivery to '+escapeHtml(destination)+'</div></div><div class=\"photo\">'+(lead?'<img src=\"'+lead[0]+'\" alt=\"Representative '+escapeHtml(v.items[0][0])+' photograph\" style=\"width:100%;height:310px;object-fit:cover\">':'')+'</div></div><div class=\"menu\"><div class=\"menu-title\"><h3>Menu & products</h3></div><div class=\"items\">'+v.items.map((x,i)=>{const a=images[x[0]];return '<div class=\"item\">'+(a?'<img class=\"product-photo\" loading=\"lazy\" src=\"'+a[0]+'\" alt=\"Representative photograph of '+escapeHtml(x[0])+'\" onerror=\"this.outerHTML=\\'<div class=&quot;failed&quot;>Photo unavailable</div>\\'\">':'<div class=\"failed\">Merchant photo pending</div>')+'<div class=\"product-copy\"><div class=\"item-name\">'+escapeHtml(x[0])+'</div><small>'+escapeHtml(x[1])+'</small><div class=\"product-buy\"><strong>'+money(x[2])+'</strong><button class=\"add\" data-i=\"'+i+'\" '+(v.unavailable.includes(i)?'disabled':'')+'>'+(v.unavailable.includes(i)?'Sold out':'+')+'</button></div>'+(a?'<a class=\"source\" href=\"'+a[1]+'\" target=\"_blank\" rel=\"noopener noreferrer\">Representative photo \u00b7 source</a>':'')+'</div></div>'}).join('')+'</div><p style=\"font-size:12px;color:#71786f\">External reference photographs\u2014not this merchant\u2019s actual inventory. Rights and exact product matching must be confirmed before publication.</p></div>';q('#vendor').querySelectorAll('.add').forEach(b=>b.onclick=()=>add(active,+b.dataset.i))};\nconst oldAdd=add;add=function(k,i){if(vendors[k].unavailable.includes(i))return;oldAdd(k,i);cart[k][cart[k].length-1].index=i};\nbuildSummary=function(){const ks=Object.keys(cart).filter(k=>cart[k].length);let total=0;q('#summary').innerHTML=ks.map(k=>{const sub=Math.round(cart[k].reduce((s,x)=>s+x.price,0)*100),tax=Math.round(sub*.09);total+=sub+tax;return '<div class=\"merchant-card\"><div class=\"merchant-title\">'+escapeHtml(vendors[k].name)+'</div>'+cart[k].map((x,i)=>'<div class=\"line\"><span>'+escapeHtml(x.name)+' <button data-k=\"'+k+'\" data-i=\"'+i+'\">Remove</button></span><span>'+money(x.price)+'</span></div>').join('')+'<div class=\"line\"><span>Illustrative tax</span><span>'+money(tax/100)+'</span></div><div class=\"subtotal\"><span>Merchant total</span><span>'+money((sub+tax)/100)+'</span></div></div>'}).join('');q('#summary').querySelectorAll('button').forEach(b=>b.onclick=()=>{cart[b.dataset.k].splice(+b.dataset.i,1);updateCart();buildSummary()});q('#grandTotal').textContent=money(total/100);q('#pay').disabled=!ks.length;return ks};\nq('.notice').textContent='Demo only: merchant purchases with one aggregated receipt. No real payment. Illustrative tax: 9% on all items, not a verified tax rate or taxability rule.';q('#pay').textContent='Place combined demo order';q('.fine').textContent='Independent merchant purchases and deliveries. Powered By Sazon. No real charge or dispatch.';q('#checkout').onclick=()=>{q('#review').style.display='block';q('#success').style.display='none';buildSummary();q('#modal').classList.add('show')};\nq('#pay').onclick=()=>{if(!validQR)return alert('Scan a valid venue QR.');const ks=buildSummary();if(ks.some(k=>!vendors[k].published||cart[k].some(x=>vendors[k].unavailable.includes(x.index))))return alert('Remove unavailable merchant items first.');const id='PL-'+Date.now().toString(36).toUpperCase();lastPurchase={id,location:destination,brand:eventBrand,orders:ks.map((k,i)=>{const subtotal=Math.round(cart[k].reduce((s,x)=>s+x.price,0)*100);return {name:vendors[k].name,stall:vendors[k].stall,id:id+'-'+(i+1),lines:structuredClone(cart[k]),subtotal,tax:Math.round(subtotal*.09),status:0}})};Object.keys(cart).forEach(k=>delete cart[k]);updateCart();drawReceipt()};\nfunction drawReceipt(){const o=lastPurchase,states=['Sent to operator','Accepted','Preparing / packing','Out for delivery','Delivered'];q('#review').style.display='none';q('#success').style.display='block';q('#success').innerHTML='<h2>Aggregated purchase receipt</h2><p>'+escapeHtml(o.brand)+' Plaza \u00b7 '+o.id+'<br>Delivery: '+escapeHtml(o.location)+'</p>'+o.orders.map(g=>'<div class=\"merchant-card\"><strong>'+escapeHtml(g.name)+'</strong>'+g.lines.map(x=>'<div class=\"line\"><span>'+escapeHtml(x.name)+'</span><span>'+money(x.price)+'</span></div>').join('')+'<div class=\"line\"><span>Illustrative tax</span><span>'+money(g.tax/100)+'</span></div><div class=\"subtotal\"><span>Merchant total</span><span>'+money((g.subtotal+g.tax)/100)+'</span></div></div>').join('')+'<div class=\"grand\"><span>Combined total</span><span>'+money(o.orders.reduce((s,g)=>s+g.subtotal+g.tax,0)/100)+'</span></div><h3>Operator delivery tickets</h3><div class=\"tickets\">'+o.orders.map((g,i)=>'<div class=\"ticket\"><strong>'+escapeHtml(g.name)+'</strong><p>'+g.id+' \u00b7 Origin '+escapeHtml(g.stall)+'<br><strong>Deliver to '+escapeHtml(o.location)+'</strong></p>'+g.lines.map(x=>'<div>'+escapeHtml(x.name)+'</div>').join('')+'<p>'+states[g.status]+'</p><button data-status=\"'+i+'\" '+(g.status===4?'disabled':'')+'>Advance demo status</button></div>').join('')+'</div><p>No payment made or real dispatch. Independent deliveries may arrive separately.</p><button class=\"pay\" id=\"back\">Back to Plaza</button>';q('#success').querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{o.orders[+b.dataset.status].status++;drawReceipt()});q('#back').onclick=()=>q('#modal').classList.remove('show')}\n\nwindow.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='plazaState')return;eventBrand=e.data.brand;q('.brand').textContent=eventBrand+' Plaza';q('.loc').textContent=eventBrand;document.title=eventBrand+' Plaza, Powered By Sazon';e.data.merchants.forEach(m=>{let k=Object.keys(vendors).find(k=>vendors[k].id===m.id);if(!k){k='m'+Object.keys(vendors).length;vendors[k]={id:m.id,name:m.name,type:m.kind||'Merchant',time:'',desc:'Connected merchant catalog',items:[],unavailable:[]}}vendors[k].name=m.name;vendors[k].stall=m.stall;vendors[k].published=m.published;vendors[k].items=m.items.map(x=>[x.name,x.desc,x.price]);vendors[k].unavailable=m.items.map((x,i)=>x.available?null:i).filter(x=>x!==null)});Object.keys(vendors).forEach(k=>{if(!e.data.merchants.some(m=>m.id===vendors[k].id))vendors[k].published=false});makeTabs();render()});\nmakeTabs();render();parent.postMessage({type:'patronReady'},'*');\n<\/script></body></html>";admin.srcdoc="<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Plaza \u00b7 Powered By Sazon</title>\n<style>\n:root{--brand:#24634e;--ink:#202a26;--muted:#68736b;--bg:#faf7ee;--line:#e4e5dc}*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}header{background:white;border-bottom:1px solid var(--line)}.wrap{max-width:1160px;margin:auto;padding:0 24px}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:80px}.logo{font:700 25px Georgia,serif}.powered{font:12px system-ui;color:var(--muted);display:block;margin-top:5px}.switch{display:flex;gap:6px}.btn{border:1px solid var(--line);border-radius:10px;background:white;padding:10px 15px;color:var(--ink);font-weight:600}.primary{background:var(--brand);color:white;border-color:var(--brand)}.hero{padding:35px 0 24px}.eyebrow{font-size:11px;letter-spacing:1.7px;text-transform:uppercase;color:var(--brand);font-weight:800}h1{font:700 44px Georgia,serif;letter-spacing:-1.5px;margin:12px 0}h2{font:700 27px Georgia,serif;margin:0 0 12px}h3{margin:0 0 10px;font-size:17px}p{line-height:1.6;color:var(--muted)}.notice{padding:12px 16px;border-radius:12px;background:#fff0ce;color:#705214;font-size:13px;margin:18px 0}.layout{display:grid;grid-template-columns:270px 1fr;gap:22px;padding-bottom:50px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:24px}.side .step{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:0;border-radius:10px;background:#f6f7f1;color:var(--muted)}.step.active{background:#e7f1e9;color:var(--brand);font-weight:700}.badge{display:inline-block;border-radius:30px;background:#e8f3e9;color:#2b6444;font-size:12px;padding:5px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:13px;font-weight:650;margin:14px 0 7px}input,select{width:100%;padding:11px;border:1px solid #d6ddd5;border-radius:9px;background:white;color:var(--ink)}input[type=checkbox]{width:auto;margin-right:8px;accent-color:var(--brand)}.check{display:flex;align-items:flex-start;line-height:1.5;font-weight:400}.help{font-size:12px;color:var(--muted);margin:6px 0 12px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}.status{border:1px solid var(--line);background:#f7faf6;padding:16px;border-radius:12px;margin:18px 0}.hidden{display:none!important}.merchant{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding:16px 0}.small{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:10px;overflow:auto;margin:20px 0}.tab{white-space:nowrap;border:1px solid var(--line);border-radius:30px;padding:12px 20px;background:white}.tab.selected{background:var(--brand);color:white}.menuhero{padding:30px;background:linear-gradient(120deg,#e8efe2,#fff5e4);border-radius:14px;margin-bottom:22px}.items{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid var(--line);border-radius:13px;padding:18px}.item strong{display:block;margin-bottom:7px}footer{text-align:center;padding:25px;color:var(--muted);font-size:12px}code{font-size:12px;overflow-wrap:anywhere}.tone{color:var(--brand)}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:flex;gap:5px;overflow:auto;padding:10px}.side .step{min-width:140px;margin:0}.grid,.items{grid-template-columns:1fr}.bar{flex-wrap:wrap;padding:15px 0}h1{font-size:34px}.wrap{padding:0 16px}.panel{padding:20px}}\n</style></head><body>\n<header><div class=\"wrap bar\"><div class=\"logo\"><span id=\"brandTitle\">Luna Night Market Plaza</span><span class=\"powered\">Powered By Sazon</span></div><div class=\"switch\"><button class=\"btn primary\" id=\"adminBtn\" onclick=\"showView('admin')\">Vendor administration</button><button class=\"btn\" id=\"publicBtn\" onclick=\"showView('public')\">Preview landing page</button></div></div></header>\n<main class=\"wrap\"><div class=\"notice\">Interactive design prototype. Profile lookups, authorization, menu imports, and webhook deliveries are simulated. No real Sazon account is accessed or changed.</div>\n<section id=\"admin\"><div class=\"hero\"><div class=\"eyebrow\">Sazon Plaza / Event workspace</div><h1>Your event. Your brand.</h1><p>Vendor = event organizer or administrator. Merchant = food operator or retailer leasing space in your event.</p></div><div class=\"layout\"><aside class=\"panel side\"><button class=\"step active\" data-step=\"brand\" onclick=\"step('brand')\">01 \u00b7 Vendor brand</button><button class=\"step\" data-step=\"connect\" onclick=\"step('connect')\">02 \u00b7 Connect merchant</button><button class=\"step\" data-step=\"sync\" onclick=\"step('sync')\">03 \u00b7 Synchronize</button><button class=\"step\" data-step=\"manage\" onclick=\"step('manage')\">04 \u00b7 Manage merchants</button></aside><div>\n<section class=\"panel pane\" id=\"brand\"><h2>Publish under your event brand</h2><p>Your vendor brand names the Plaza. Each participating merchant keeps its own identity and menu.</p><div class=\"grid\"><div><label for=\"eventName\">Vendor / event brand</label><input id=\"eventName\" value=\"Luna Night Market\" maxlength=\"80\"></div><div><label for=\"eventColor\">Brand accent</label><input id=\"eventColor\" type=\"color\" value=\"#24634e\"></div><div><label for=\"eventPlace\">Event location</label><input id=\"eventPlace\" value=\"San Jos\u00e9, California\"></div><div><label for=\"eventHours\">Public hours</label><input id=\"eventHours\" value=\"Friday \u00b7 5\u201310 PM\"></div><div><label for=\"contact\">Vendor administrator email</label><input id=\"contact\" type=\"email\" placeholder=\"admin@your-event.com\"></div><div><label for=\"domain\">Preferred custom domain (request only)</label><input id=\"domain\" placeholder=\"order.your-event.com\"></div></div><p class=\"help\">Domain verification and DNS setup require the production service. This prototype does not publish a site or provision a domain.</p><div class=\"actions\"><button class=\"btn primary\" onclick=\"saveBrand()\">Apply brand & connect a merchant \u2192</button></div></section>\n<section class=\"panel pane hidden\" id=\"connect\"><h2>Bring a merchant\u2019s Sazon menu over</h2><p>Ask the merchant for their existing Sazon ID. Import their profile menu; do not re-enter products or prices.</p><label for=\"sazonId\">Merchant\u2019s Sazon ID</label><input id=\"sazonId\" placeholder=\"Try SAZ-DEMO-001\" autocomplete=\"off\"><p class=\"help\">Demo: SAZ-DEMO-001 = ready profile; SAZ-DEMO-002 = incomplete onboarding. Any other ID is not found in this demo.</p><label for=\"merchantEmail\">Merchant account contact email</label><input id=\"merchantEmail\" type=\"email\" placeholder=\"owner@merchant.com\"><p class=\"help\">Production must verify the account through Sazon authorization. An ID or matching email alone is not authorization.</p><label class=\"check\"><input type=\"checkbox\" id=\"permission\">I have permission to invite this merchant to the event. The account owner must approve profile and menu access.</label><div class=\"actions\"><button class=\"btn primary\" id=\"lookupBtn\" onclick=\"lookup()\">Check profile & connection readiness</button></div><div id=\"profileResult\" aria-live=\"polite\"></div><div class=\"status\"><strong>Merchant does not have a Sazon profile?</strong><p>Create or complete their account first, then return here with their Sazon ID.</p><button class=\"btn\" onclick=\"onboard()\">Merchant onboarding instructions \u2197</button></div></section>\n<section class=\"panel pane hidden\" id=\"sync\"><h2>Authorize & synchronize</h2><p id=\"selectedProfile\">Select a merchant profile first.</p><div class=\"grid\"><div><label for=\"profileLocation\">Which merchant location/menu?</label><select id=\"profileLocation\"><option value=\"truck\">Food truck \u00b7 Main menu</option><option value=\"popup\">Pop-up \u00b7 Event menu</option></select></div><div><label for=\"pickup\">Merchant pickup / stall label</label><input id=\"pickup\" value=\"Stall A-04\" maxlength=\"80\"></div><div><label for=\"syncStart\">When should the merchant appear?</label><select id=\"syncStart\"><option>Immediately after successful import</option><option>Keep unpublished until vendor approves</option></select></div><div><label for=\"closedMode\">When merchant is closed</label><select id=\"closedMode\"><option>Keep tab visible; disable ordering</option><option>Hide merchant tab</option></select></div></div><label>What should stay synchronized?</label><label class=\"check\"><input type=\"checkbox\" id=\"menuScope\" checked>Menu categories, items, descriptions, and prices (required)</label><label class=\"check\"><input type=\"checkbox\" id=\"availabilityScope\" checked>Sold-out items and item availability</label><label class=\"check\"><input type=\"checkbox\" id=\"hoursScope\" checked>Merchant operating status and hours</label><label class=\"check\"><input type=\"checkbox\" id=\"profileScope\" checked>Merchant display name and profile branding</label><div class=\"status\"><strong>Managed webhook connection</strong><p>The production backend generates the destination, registers supported subscriptions, stores the signing secret securely, and verifies incoming signatures. Merchants should not paste secrets into this page.</p><span class=\"small\">Proposed events below are adapter requirements, not verified Sazon API event names.</span><p><code>menu.updated \u00b7 item.availability_changed \u00b7 location.status_changed \u00b7 merchant.updated</code></p></div><label class=\"check\"><input type=\"checkbox\" id=\"authorize\">Demo only: simulate the merchant account owner granting read access and webhook synchronization for this event. Production requires authenticated authorization.</label><div class=\"actions\"><button class=\"btn\" onclick=\"step('connect')\">Back</button><button class=\"btn primary\" id=\"syncBtn\" onclick=\"synchronize()\">Authorize & synchronize menu</button></div><div id=\"syncResult\" aria-live=\"polite\"></div></section>\n<section class=\"panel pane hidden\" id=\"manage\"><h2>Merchants & connection health</h2><p>Event-branded destination; merchant-owned menus. No payments or tax processing are connected in this prototype.</p><div id=\"merchantList\"></div><div class=\"actions\"><button class=\"btn\" onclick=\"step('connect')\">+ Connect another merchant</button><button class=\"btn primary\" onclick=\"showView('public')\">Preview your Plaza \u2192</button></div><div class=\"status\"><strong>Try a webhook-style update</strong><p>Simulate a merchant marking their first menu item sold out. The public menu and connection timestamp update without re-entering the menu.</p><button class=\"btn\" onclick=\"simulateEvent()\">Simulate availability event</button></div><details><summary>Production integration checklist</summary><p>Authenticated vendor workspace; merchant-owner consent; actual profile lookup and onboarding URL; subscription registration; server-side signature verification; event deduplication; version-aware updates; retry/dead-letter queue; periodic reconciliation; persistent database; access revocation; tenant isolation; audit log. Browser code must never hold API keys or signing secrets.</p></details></section>\n</div></div></section>\n<section id=\"public\" class=\"hidden\"><div class=\"hero\"><div class=\"eyebrow\" id=\"publicMeta\">San Jos\u00e9, California \u00b7 Friday \u00b7 5\u201310 PM</div><h1 id=\"publicHeading\">Welcome to Luna Night Market Plaza.</h1><p>Discover the merchants. Find your favorite. Enjoy the night.</p></div><nav class=\"tabs\" id=\"publicTabs\" aria-label=\"Merchant menus\"></nav><section class=\"panel\" id=\"publicMenu\"></section><p class=\"small\">Preview only \u00b7 Prices and availability are sample data. Ordering is not connected.</p></section>\n<footer><span id=\"footerBrand\">Luna Night Market Plaza</span> \u00b7 Powered By Sazon</footer></main>\n<dialog id=\"onboardDialog\" style=\"max-width:540px;border:1px solid #ddd;border-radius:18px;padding:26px\"><h2>Complete Sazon onboarding</h2><p>Ask the merchant to create or complete their profile, publish a menu, and authorize this event connection. Then return to Plaza and enter their Sazon ID.</p><label for=\"onboardURL\">Official Sazon onboarding URL</label><input id=\"onboardURL\" type=\"url\" placeholder=\"Paste your verified onboarding URL\"><p class=\"help\">No onboarding route was supplied. Configure the real route here; this prototype will not invent a destination.</p><div class=\"actions\"><button class=\"btn\" onclick=\"document.querySelector('#onboardDialog').close()\">Close</button><button class=\"btn primary\" onclick=\"openOnboarding()\">Open onboarding \u2197</button></div><p class=\"small\" id=\"onboardError\"></p></dialog>\n<script>\nconst $=id=>document.getElementById(id);let selected=null,activeMerchant=0;const merchants=[];\nconst profiles={'SAZ-DEMO-001':{id:'SAZ-DEMO-001',name:'Tacos El Sol',ready:true},'SAZ-DEMO-002':{id:'SAZ-DEMO-002',name:'Arepas Co.',ready:false}};\nconst esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction step(id){document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('hidden',p.id!==id));document.querySelectorAll('.step').forEach(b=>b.classList.toggle('active',b.dataset.step===id));if(id==='manage')renderMerchants()}\nfunction showView(v){$('admin').classList.toggle('hidden',v!=='admin');$('public').classList.toggle('hidden',v!=='public');$('adminBtn').classList.toggle('primary',v==='admin');$('publicBtn').classList.toggle('primary',v==='public');if(v==='public')renderPublic()}\nfunction saveBrand(){const n=$('eventName').value.trim();if(!n)return alert('Enter the vendor / event brand.');const title=n+' Plaza';$('brandTitle').textContent=title;$('footerBrand').textContent=title;$('publicHeading').textContent='Welcome to '+title+'.';$('publicMeta').textContent=$('eventPlace').value+' \u00b7 '+$('eventHours').value;document.documentElement.style.setProperty('--brand',$('eventColor').value);step('connect')}\nfunction lookup(){selected=null;if(!$('permission').checked)return alert('Confirm permission to invite the merchant.');if(!$('merchantEmail').value||!$('merchantEmail').checkValidity())return alert('Enter a valid merchant contact email.');let id=$('sazonId').value.trim().toUpperCase();let p=profiles[id];if(!p){$('profileResult').innerHTML='<div class=\"status\"><strong>Profile not found in demo</strong><p>Check the merchant ID or direct the merchant to onboarding. No automatic connection was created.</p><button class=\"btn\" onclick=\"onboard()\">Go to onboarding instructions \u2197</button></div>';return}if(!p.ready){$('profileResult').innerHTML='<div class=\"status\"><strong>'+esc(p.name)+' \u00b7 onboarding incomplete</strong><p>Sample profile has no published menu. Ask the merchant to complete onboarding and publish their menu before synchronization.</p><button class=\"btn\" onclick=\"onboard()\">Complete onboarding \u2197</button></div>';return}selected={...p};$('profileResult').innerHTML='<div class=\"status\"><span class=\"badge\">Demo profile found</span><h3 style=\"margin-top:14px\">'+esc(p.name)+'</h3><p>Published menu available. Owner authorization required before import.</p><button class=\"btn primary\" onclick=\"step(\\'sync\\')\">Configure automatic synchronization \u2192</button></div>';$('selectedProfile').textContent=p.name+' \u00b7 '+p.id+' \u00b7 Merchant-owned Sazon profile';$('syncResult').innerHTML='';$('authorize').checked=false}\nfunction onboard(){$('onboardDialog').showModal()}\nfunction openOnboarding(){try{const u=new URL($('onboardURL').value);if(u.protocol!=='https:')throw Error();window.open(u.href,'_blank','noopener,noreferrer');$('onboardError').textContent='Opened the configured onboarding destination. Return with the merchant ID.'}catch(e){$('onboardError').textContent='Configure a valid, verified HTTPS onboarding URL first.'}}\nasync function synchronize(){if(!selected)return alert('Look up a ready merchant profile first.');if(!$('menuScope').checked)return alert('Menu synchronization is required.');if(!$('authorize').checked)return alert('Simulate merchant-owner authorization first.');if(!$('pickup').value.trim())return alert('Enter a pickup / stall label.');$('syncBtn').disabled=true;$('syncResult').innerHTML='<div class=\"status\">Simulating owner authorization \u2192 importing menu \u2192 registering subscriptions \u2192 checking connection\u2026</div>';await new Promise(r=>setTimeout(r,800));const m={...selected,stall:$('pickup').value.trim(),menuLocation:$('profileLocation').value,published:$('syncStart').selectedIndex===0,availability:$('availabilityScope').checked,lastSync:new Date().toLocaleString(),items:[{name:'Birria Tacos',desc:'Three tacos with consomm\u00e9, onion & cilantro',price:14,available:true},{name:'Carne Asada Burrito',desc:'Rice, beans, pico & salsa roja',price:16,available:true},{name:'Horchata',desc:'Cinnamon rice milk',price:4,available:true}]};let i=merchants.findIndex(x=>x.id===m.id);if(i>=0)merchants[i]=m;else merchants.push(m);$('syncResult').innerHTML='<div class=\"status\"><span class=\"badge\">Demo synchronization complete</span><p>3 items imported. Managed subscriptions simulated; no real endpoint was registered.</p><button class=\"btn primary\" onclick=\"step(\\'manage\\')\">Manage connected merchants \u2192</button></div>';$('syncBtn').disabled=false;renderMerchants()}\nfunction renderMerchants(){$('merchantList').innerHTML=merchants.length?merchants.map((m,i)=>'<div class=\"merchant\"><div><strong>'+esc(m.name)+'</strong><p class=\"small\">'+esc(m.id)+' \u00b7 '+esc(m.stall)+'<br>Demo sync: '+esc(m.lastSync)+'<br>'+ (m.published?'Published in preview':'Unpublished')+'</p></div><div><button class=\"btn\" onclick=\"togglePublish('+i+')\">'+(m.published?'Unpublish':'Publish')+'</button> <button class=\"btn\" onclick=\"disconnect('+i+')\">Disconnect</button></div></div>').join(''):'<div class=\"status\">No merchants connected yet. Enter SAZ-DEMO-001 to try the complete connection flow.</div>'}\nfunction togglePublish(i){merchants[i].published=!merchants[i].published;renderMerchants()}\nfunction disconnect(i){if(confirm('Disconnect this merchant and remove their menu from this Plaza preview?')){merchants.splice(i,1);renderMerchants();renderPublic()}}\nfunction simulateEvent(){const m=merchants.find(x=>x.availability);if(!m)return alert('Connect a merchant with availability synchronization enabled.');m.items[0].available=!m.items[0].available;m.lastSync=new Date().toLocaleString();renderMerchants();renderPublic();alert('Simulated availability event applied. View the landing page to see the change.')}\nfunction renderPublic(){const shown=merchants.filter(x=>x.published);if(!shown.length){$('publicTabs').innerHTML='';$('publicMenu').innerHTML='<h2>Merchants coming soon</h2><p>The vendor has not published any merchants yet. Connect a ready Sazon profile and publish it from administration.</p>';return}if(activeMerchant>=shown.length)activeMerchant=0;$('publicTabs').innerHTML=shown.map((m,i)=>'<button class=\"tab '+(i===activeMerchant?'selected':'')+'\" onclick=\"activeMerchant='+i+';renderPublic()\">'+esc(m.name)+'</button>').join('');const m=shown[activeMerchant];$('publicMenu').innerHTML='<div class=\"menuhero\"><span class=\"badge\">Connected menu \u00b7 demo</span><h2 style=\"margin-top:18px\">'+esc(m.name)+'</h2><p>Pickup: '+esc(m.stall)+' \u00b7 '+esc(m.menuLocation==='truck'?'Main menu':'Event menu')+'</p></div><h3>Merchant menu</h3><div class=\"items\">'+m.items.map(x=>'<div class=\"item\"><strong>'+esc(x.name)+'</strong><p class=\"small\">'+esc(x.desc)+'</p><div style=\"display:flex;justify-content:space-between;align-items:center\"><span>$'+x.price.toFixed(2)+'</span><button class=\"btn\" disabled>'+(x.available?'Ordering not connected':'Sold out')+'</button></div></div>').join('')+'</div><p class=\"small\">Menu source: '+esc(m.id)+' \u00b7 Last demo sync: '+esc(m.lastSync)+'</p>'}\n<\/script><script>\nconst seeds=[{\"id\": \"SAZ-DEMO-001\", \"name\": \"Tacos El Sol\", \"kind\": \"Food operator\", \"stall\": \"A-04\", \"ready\": true, \"published\": true, \"availability\": true, \"lastSync\": \"Demo connected\", \"items\": [{\"name\": \"Birria Tacos\", \"desc\": \"Sample merchant item\", \"price\": 14, \"available\": true}, {\"name\": \"Carne Asada Burrito\", \"desc\": \"Sample merchant item\", \"price\": 16, \"available\": true}, {\"name\": \"Horchata\", \"desc\": \"Sample merchant item\", \"price\": 4, \"available\": true}]}, {\"id\": \"SAZ-DEMO-003\", \"name\": \"Arepas Co.\", \"kind\": \"Food operator\", \"stall\": \"A-08\", \"ready\": true, \"published\": true, \"availability\": true, \"lastSync\": \"Demo connected\", \"items\": [{\"name\": \"Reina Pepiada\", \"desc\": \"Sample merchant item\", \"price\": 13, \"available\": true}, {\"name\": \"Pabell\\u00f3n Arepa\", \"desc\": \"Sample merchant item\", \"price\": 14, \"available\": true}, {\"name\": \"Passionfruit Juice\", \"desc\": \"Sample merchant item\", \"price\": 5, \"available\": true}]}, {\"id\": \"SAZ-DEMO-004\", \"name\": \"Curry Cart\", \"kind\": \"Food operator\", \"stall\": \"B-02\", \"ready\": true, \"published\": true, \"availability\": true, \"lastSync\": \"Demo connected\", \"items\": [{\"name\": \"Green Curry Bowl\", \"desc\": \"Sample merchant item\", \"price\": 14, \"available\": true}, {\"name\": \"Red Curry Chicken\", \"desc\": \"Sample merchant item\", \"price\": 15, \"available\": true}, {\"name\": \"Thai Iced Tea\", \"desc\": \"Sample merchant item\", \"price\": 4, \"available\": true}]}, {\"id\": \"SAZ-DEMO-005\", \"name\": \"Luna Bijouterie\", \"kind\": \"Bijouterie retailer\", \"stall\": \"C-06\", \"ready\": true, \"published\": true, \"availability\": true, \"lastSync\": \"Demo connected\", \"items\": [{\"name\": \"Golden Hoop Earrings\", \"desc\": \"Sample merchant item\", \"price\": 22, \"available\": true}, {\"name\": \"Beaded Bracelet\", \"desc\": \"Sample merchant item\", \"price\": 12, \"available\": true}, {\"name\": \"Moon Pendant Necklace\", \"desc\": \"Sample merchant item\", \"price\": 28, \"available\": true}]}];seeds.forEach(m=>{merchants.push(structuredClone(m));profiles[m.id]=structuredClone(m)});\nfunction broadcast(){parent.postMessage({type:'adminState',brand:$('eventName').value,merchants:structuredClone(merchants)},'*')}\nconst priorSave=saveBrand;saveBrand=function(){priorSave();broadcast()};const priorToggle=togglePublish;togglePublish=function(i){priorToggle(i);broadcast()};const priorDisconnect=disconnect;disconnect=function(i){priorDisconnect(i);broadcast()};const priorEvent=simulateEvent;simulateEvent=function(){priorEvent();broadcast()};const priorSync=synchronize;synchronize=async function(){await priorSync();if(selected){const m=merchants.find(m=>m.id===selected.id),p=profiles[selected.id];if(m&&p.items){m.items=structuredClone(p.items);m.kind=p.kind;renderMerchants()}}broadcast()};\n$('publicBtn').onclick=()=>{broadcast();parent.postMessage({type:'openPatron'},'*')};$('publicBtn').textContent='Open patron ordering';$('profileLocation').innerHTML='<option>Main menu / product catalog</option><option>Event menu / catalog</option>';renderMerchants();broadcast();\n<\/script><script>function liveBrand(){const brand=$('eventName').value.trim();$('brandTitle').textContent=brand+' Plaza';$('footerBrand').textContent=brand+' Plaza';document.title=brand+' Plaza, Powered By Sazon';broadcast();}$('eventName').addEventListener('input',liveBrand);$('eventName').addEventListener('change',liveBrand);liveBrand();<\/script></body></html>";</script></body></html>
